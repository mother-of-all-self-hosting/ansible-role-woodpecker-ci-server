---
# Role defaults are not in scope here, but the version that Renovate bumps
# lives in them and is what the running server is checked against below.
- name: Load the Woodpecker CI server role defaults
  ansible.builtin.include_vars:
    file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
    name: woodpecker_ci_server_defaults

- name: Read the OAuth client id for the helper Forgejo
  ansible.builtin.slurp:
    src: "{{ woodpecker_ci_server_molecule_state_path }}/oauth-client-id"
  register: woodpecker_ci_server_molecule_oauth_client_id_file

- name: Set the OAuth client id for the helper Forgejo
  ansible.builtin.set_fact:
    woodpecker_ci_server_molecule_oauth_client_id: "{{ woodpecker_ci_server_molecule_oauth_client_id_file.content | b64decode | trim }}"

- name: Wait for Woodpecker CI server service to become active (up to 180s)
  ansible.builtin.systemd:
    name: woodpecker-ci-server.service
  register: woodpecker_ci_server_service
  until: woodpecker_ci_server_service.status.ActiveState == 'active'
  retries: 36
  delay: 5

- name: Assert Woodpecker CI server service is active
  ansible.builtin.assert:
    that: woodpecker_ci_server_service.status.ActiveState == 'active'
    fail_msg: "woodpecker-ci-server.service not active ({{ woodpecker_ci_server_service.status.ActiveState }})"
    success_msg: "woodpecker-ci-server.service is active"

- name: Retrieve Woodpecker CI server service log for debugging
  when: woodpecker_ci_server_debug_service_enabled | bool
  ansible.builtin.command:
    cmd: journalctl -xeu woodpecker-ci-server.service
  changed_when: false

# `active` only means the `docker start --attach` process is alive. A server
# that rejects its configuration exits during startup, and systemd restarts
# it forever, so the container has to be confirmed running in its own right.
- name: Inspect the Woodpecker CI server container
  ansible.builtin.command:
    cmd: docker container inspect woodpecker-ci-server
  register: woodpecker_ci_server_container_inspect
  changed_when: false

- name: Assert the Woodpecker CI server container is running
  ansible.builtin.assert:
    that: (woodpecker_ci_server_container_inspect.stdout | from_json | first).State.Running
    fail_msg: "The Woodpecker CI server container is not running: {{ (woodpecker_ci_server_container_inspect.stdout | from_json | first).State }}"
    success_msg: "The Woodpecker CI server container is running"

# A server whose configuration did not pass validation never reaches the
# point of serving anything, so this answering is what tells a serving
# instance apart from a merely running container.
- name: Wait for the Woodpecker CI server health endpoint to answer (up to 10m)
  ansible.builtin.uri:
    url: "{{ woodpecker_ci_server_molecule_base_url }}/healthz"
    method: GET
    status_code: [200, 204, 404, 500, 502, 503]
  register: woodpecker_ci_server_healthz
  until: woodpecker_ci_server_healthz.status == 204
  retries: 120
  delay: 5

- name: Assert Woodpecker CI server reports itself as healthy
  ansible.builtin.assert:
    that: woodpecker_ci_server_healthz.status == 204
    fail_msg: "Woodpecker CI server is not healthy ({{ woodpecker_ci_server_healthz.status }})"
    success_msg: "Woodpecker CI server reports itself as healthy"

- name: Query the version of the running Woodpecker CI server
  ansible.builtin.uri:
    url: "{{ woodpecker_ci_server_molecule_base_url }}/version"
    method: GET
    status_code: [200, 404, 500, 502, 503]
    return_content: true
  register: woodpecker_ci_server_version_endpoint

# The server reports a bare version (`3.17.0`), while the variable that
# Renovate bumps carries a leading `v`. Normalized on both sides, so that
# this keeps holding if either side ever stops carrying one.
- name: Assert the running Woodpecker CI server is the version this role installs
  ansible.builtin.assert:
    that: >-
      woodpecker_ci_server_version_endpoint.json.version | regex_replace('^v', '')
      ==
      woodpecker_ci_server_defaults.woodpecker_ci_server_version | regex_replace('^v', '')
    fail_msg: >-
      Woodpecker CI server reports {{ woodpecker_ci_server_version_endpoint.json.version }},
      expected {{ woodpecker_ci_server_defaults.woodpecker_ci_server_version }}
    success_msg: "Woodpecker CI server reports {{ woodpecker_ci_server_version_endpoint.json.version }}"

- name: Retrieve the Woodpecker CI server web interface
  ansible.builtin.uri:
    url: "{{ woodpecker_ci_server_molecule_base_url }}/"
    method: GET
    status_code: [200, 302, 404, 500, 502, 503]
    follow_redirects: none
    return_content: true
  register: woodpecker_ci_server_endpoint

- name: Assert the Woodpecker CI server web interface is served
  ansible.builtin.assert:
    that:
      - woodpecker_ci_server_endpoint.status == 200
      - "'<title>Woodpecker</title>' in woodpecker_ci_server_endpoint.content"
    fail_msg: "The Woodpecker CI server web interface did not render as expected ({{ woodpecker_ci_server_endpoint.status }})"
    success_msg: "The Woodpecker CI server web interface is served"

# Where the server sends a user who wants to log in. It builds this redirect
# out of the forge settings this role wrote, so it is the first place the
# configuration becomes observable from outside the process.
- name: Retrieve the Woodpecker CI server login redirect
  ansible.builtin.uri:
    url: "{{ woodpecker_ci_server_molecule_base_url }}/authorize"
    method: GET
    status_code: [200, 302, 303, 404, 500, 502, 503]
    follow_redirects: none
  register: woodpecker_ci_server_authorize

- name: Assert the Woodpecker CI server login redirect points at the forge
  ansible.builtin.assert:
    that:
      - woodpecker_ci_server_authorize.status == 303
      - woodpecker_ci_server_authorize.location | urlsplit('netloc') == woodpecker_ci_server_molecule_forgejo_url | urlsplit('netloc')
      - woodpecker_ci_server_authorize.location | urlsplit('path') == '/login/oauth/authorize'
    fail_msg: "The login redirect does not point at the forge: {{ woodpecker_ci_server_authorize.location | default('no redirect') }}"
    success_msg: "The login redirect points at {{ woodpecker_ci_server_authorize.location | urlsplit('netloc') }}{{ woodpecker_ci_server_authorize.location | urlsplit('path') }}"

# The client id was minted by the running Forgejo when prepare.yml
# registered the application, so the server carrying it here is not
# something this scenario could have arranged by writing a literal into
# both places: both sides are talking about the same OAuth application.
#
# The redirect URI is the other direction - the server derived it from
# WOODPECKER_HOST, which is built out of the role's own scheme and hostname
# settings, so a role-set value is observable in the running process.
# Matched as literal substrings of the query rather than with a regular
# expression: the values are known exactly, and a trailing separator is
# appended to both sides so that a value cannot match a longer one by
# being a prefix of it.
- name: Assert the login redirect carries the credentials the forge minted
  ansible.builtin.assert:
    that:
      - >-
        'client_id=' + woodpecker_ci_server_molecule_oauth_client_id + '&'
        in woodpecker_ci_server_authorize.location + '&'
      - >-
        'redirect_uri=' + woodpecker_ci_server_molecule_redirect_uri + '&'
        in (woodpecker_ci_server_authorize.location | urldecode) + '&'
    fail_msg: "The login redirect does not carry the expected OAuth parameters: {{ woodpecker_ci_server_authorize.location | urlsplit('query') }}"
    success_msg: "The login redirect carries the forge-minted client id and the role-configured redirect URI"

# Everything above is the server talking about the forge. Whether it can
# actually talk *to* the forge is a separate question, and the only way to
# answer it is to complete a login: the server has to exchange the
# authorization code for a token over the network and ask the forge who the
# user is, before it will admit anyone.
#
# Driven with python3 rather than `ansible.builtin.uri`, because the flow
# depends on a session cookie the forge sets on a 303, and the uri module
# exposes cookies only for 2xx responses.
- name: Log into Woodpecker CI server through the forge (up to 60s)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import http.cookiejar
        import json
        import sys
        import urllib.error
        import urllib.parse
        import urllib.request

        forge_url, server_url, username, password = sys.argv[1:5]

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, *args, **kwargs):
                return None

        opener = urllib.request.build_opener(
            urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),
            NoRedirect,
        )

        def call(url, form=None):
            data = urllib.parse.urlencode(form).encode() if form else None
            headers = {"Content-Type": "application/x-www-form-urlencoded"} if form else {}
            request = urllib.request.Request(url, data=data, headers=headers)
            try:
                response = opener.open(request, timeout=30)
                return response.status, response.headers, response.read()
            except urllib.error.HTTPError as error:
                return error.code, error.headers, error.read()

        # The forge's authorization endpoint is a browser route: it issues a
        # code only to a logged-in session, so a session comes first.
        call(forge_url + "/user/login")
        status, _, _ = call(forge_url + "/user/login", {"user_name": username, "password": password})
        if status != 303:
            sys.exit("Logging into the forge answered %d, expected 303" % status)

        # The state is minted and signed by the server, so it has to come
        # from the server's own redirect rather than be invented here.
        status, headers, _ = call(server_url + "/authorize")
        if status != 303:
            sys.exit("The server's /authorize answered %d, expected 303" % status)
        query = urllib.parse.parse_qs(urllib.parse.urlsplit(headers["Location"]).query)
        params = {
            "client_id": query["client_id"][0],
            "redirect_uri": query["redirect_uri"][0],
            "state": query["state"][0],
        }

        status, headers, _ = call(
            forge_url + "/login/oauth/authorize?" + urllib.parse.urlencode(dict(params, response_type="code"))
        )
        location = headers.get("Location", "")
        if "code=" not in location:
            # The first authorization of an application renders a consent
            # page; a repeat authorization is granted straight away.
            status, headers, _ = call(forge_url + "/login/oauth/grant", dict(params, granted="true"))
            location = headers.get("Location", "")
        if "code=" not in location:
            sys.exit("The forge issued no authorization code (%d, %s)" % (status, location))
        code = urllib.parse.parse_qs(urllib.parse.urlsplit(location).query)["code"][0]

        # Redeeming the code is what makes the server talk to the forge over
        # the network: it exchanges the code for a token and asks the forge
        # who the user is.
        status, _, _ = call(server_url + "/authorize?" + urllib.parse.urlencode({"code": code, "state": params["state"]}))
        if status != 303:
            sys.exit("Redeeming the authorization code answered %d, expected 303" % status)

        status, _, body = call(server_url + "/api/user")
        if status != 200:
            sys.exit("The server's /api/user answered %d, expected 200" % status)
        user = json.loads(body)

        print("login=%s" % user["login"])
        print("email=%s" % user["email"])
        print("admin=%s" % json.dumps(user["admin"]))
        print("forge_remote_id=%s" % user["forge_remote_id"])
        print("avatar_netloc=%s" % urllib.parse.urlsplit(user["avatar_url"]).netloc)
      - "{{ woodpecker_ci_server_molecule_forgejo_base_url }}"
      - "{{ woodpecker_ci_server_molecule_base_url }}"
      - "{{ woodpecker_ci_server_molecule_admin_username }}"
      - "{{ woodpecker_ci_server_molecule_admin_password }}"
  register: woodpecker_ci_server_login
  changed_when: false
  until: woodpecker_ci_server_login.rc == 0
  retries: 12
  delay: 5

# The identity comes back from the forge, over the connection the exchange
# just made, and the admin flag comes from WOODPECKER_ADMIN, which this role
# wrote out of `woodpecker_ci_server_config_admins`. Seeing both in one
# payload ties the forge integration and the role's configuration together.
- name: Assert the forge authenticated the user to Woodpecker CI server
  ansible.builtin.assert:
    that:
      - "'login=' + woodpecker_ci_server_molecule_admin_username in woodpecker_ci_server_login.stdout"
      - "'email=' + woodpecker_ci_server_molecule_admin_email in woodpecker_ci_server_login.stdout"
      - "'admin=true' in woodpecker_ci_server_login.stdout"
      - "'avatar_netloc=' + (woodpecker_ci_server_molecule_forgejo_url | urlsplit('netloc')) in woodpecker_ci_server_login.stdout"
    fail_msg: "Woodpecker CI server did not report a user authenticated by the forge: {{ woodpecker_ci_server_login.stdout }}"
    success_msg: "The forge authenticated the user to Woodpecker CI server: {{ woodpecker_ci_server_login.stdout_lines | join(' ') }}"

- name: Show Woodpecker CI server verification summary
  ansible.builtin.debug:
    msg:
      - "Woodpecker CI server systemd: {{ woodpecker_ci_server_service.status.ActiveState }}"
      - "Woodpecker CI server version: {{ woodpecker_ci_server_version_endpoint.json.version }}"
      - "Woodpecker CI server web interface: {{ woodpecker_ci_server_endpoint.status }}"
      - "Woodpecker CI server login redirect: {{ woodpecker_ci_server_authorize.location }}"
      - "Forge-authenticated user: {{ woodpecker_ci_server_login.stdout_lines | join(' ') }}"
