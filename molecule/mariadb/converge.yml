---
- name: Include roles for Woodpecker CI server Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Minted by prepare.yml against the helper Forgejo. Read from disk rather
    # than re-minted, so that the values (which end up in the environment file)
    # are the same on every converge run and the idempotence check stays honest.
    - name: Read the OAuth client id for the helper Forgejo
      ansible.builtin.slurp:
        src: "{{ woodpecker_ci_server_molecule_state_path }}/oauth-client-id"
      register: woodpecker_ci_server_molecule_oauth_client_id_file

    - name: Read the OAuth client secret for the helper Forgejo
      ansible.builtin.slurp:
        src: "{{ woodpecker_ci_server_molecule_state_path }}/oauth-client-secret"
      register: woodpecker_ci_server_molecule_oauth_client_secret_file

    - name: Set the OAuth credentials for the helper Forgejo
      ansible.builtin.set_fact:
        woodpecker_ci_server_config_forgejo_client: "{{ woodpecker_ci_server_molecule_oauth_client_id_file.content | b64decode | trim }}"
        woodpecker_ci_server_config_forgejo_secret: "{{ woodpecker_ci_server_molecule_oauth_client_secret_file.content | b64decode | trim }}"

    - name: Include roles for Woodpecker CI server Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-mariadb
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure MariaDB systemd service is started
      ansible.builtin.systemd_service:
        name: mariadb.service
        state: started

    - name: Ensure Woodpecker CI server systemd service is started
      ansible.builtin.systemd_service:
        name: woodpecker-ci-server.service
        state: started
